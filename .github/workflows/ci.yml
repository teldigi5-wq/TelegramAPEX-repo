name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: telegram-apex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve patched Electron lockfile metadata
        shell: bash
        run: |
          cd electron
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.packages['node_modules/electron']?.version !== '44.9.1') throw new Error('Electron resolution did not select 44.9.1');
          const b64 = fs.readFileSync('package-lock.json').toString('base64');
          for (let i = 0; i < b64.length; i += 8000) {
            console.log('ELECTRON_LOCK_CHUNK_' + String(i / 8000).padStart(4, '0') + '=' + b64.slice(i, i + 8000));
          }
          console.log('ELECTRON_LOCK_END=' + Math.ceil(b64.length / 8000));
          NODE

      - name: Check Python syntax
        run: python -m py_compile TelegramAPEX_v9.py

      - name: Check Electron JavaScript syntax
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/navigation-policy.js
          node --test electron/navigation-policy.test.js

      - name: Test private loopback browser-origin policy
        run: |
          python -m py_compile desktop_origin_policy.py desktop_media_policy.py desktop_media_paths.py TelegramAPEX_v9.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate JSON configuration
        shell: python
        run: |
          import json
          from pathlib import Path

          for path in (Path('config_v10.example.json'), Path('electron/package.json')):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'{path} is valid JSON')
