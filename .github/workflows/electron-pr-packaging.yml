name: PR Windows Installer Integration

# Builds the Python backend, bundles it inside an Electron desktop shell,
# and packages the result as a Windows installer (.exe) via electron-builder.
on:
  pull_request:
    branches: [main]
    paths:
      - 'electron/**'
      - 'TelegramAPEX_v9.py'
      - 'desktop_*.py'
      - '.github/workflows/electron-pr-packaging.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: telegram-apex-pr-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install telethon pillow cryptg pyaes rsa flask pyinstaller

      - name: Build backend EXE with PyInstaller
        shell: cmd
        run: |
          python -m PyInstaller TelegramAPEX_v9.py ^
            --onefile --console --name TelegramAPEX_v10 --noconfirm ^
            --collect-all telethon --collect-all flask ^
            --collect-all werkzeug --collect-all jinja2 --collect-all click ^
            --hidden-import telethon --hidden-import telethon.sessions ^
            --hidden-import telethon.sessions.sqlite --hidden-import telethon.network ^
            --hidden-import telethon.network.mtprotosender --hidden-import telethon.crypto ^
            --hidden-import telethon.crypto.aes --hidden-import telethon.tl ^
            --hidden-import telethon.tl.types --hidden-import telethon.tl.functions ^
            --hidden-import telethon.errors --hidden-import telethon.errors.rpcerrorlist ^
            --hidden-import telethon.extensions --hidden-import PIL --hidden-import PIL.Image ^
            --hidden-import cryptg --hidden-import pyaes --hidden-import rsa ^
            --hidden-import flask --hidden-import werkzeug --hidden-import jinja2 ^
            --hidden-import click --hidden-import sqlite3 --hidden-import _sqlite3 ^
            --hidden-import asyncio --hidden-import ssl --hidden-import certifi ^
            --hidden-import urllib3 --hidden-import threading --hidden-import socket ^
            --exclude-module matplotlib --exclude-module numpy --exclude-module pandas ^
            --exclude-module PyQt5 --exclude-module tkinter --exclude-module test

      - name: Verify backend build
        shell: cmd
        run: |
          if not exist dist\TelegramAPEX_v10.exe (
            echo Backend build failed - exe not found
            exit /b 1
          )

      - name: Stage backend into electron/backend
        shell: cmd
        run: |
          mkdir electron\backend
          copy dist\TelegramAPEX_v10.exe electron\backend\TelegramAPEX_v10.exe

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Audit pinned Electron build dependencies
        working-directory: electron
        run: npm audit --audit-level=high

      - name: Build Windows installer
        working-directory: electron
        run: npm run dist

      - name: Locate installer
        id: find_installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "electron/release" -Filter "*.exe" | Select-Object -First 1
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          if (-not $exe) { throw 'Electron installer was not created' }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash
          Write-Host "PR installer SHA256: $hash"
          echo "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: TelegramAPEX-PR-Windows-Installer
          path: ${{ steps.find_installer.outputs.path }}
          if-no-files-found: error
          retention-days: 7

